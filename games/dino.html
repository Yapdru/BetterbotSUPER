<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino Dash</title>
<style>html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:#7fd6ff}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:14px;left:16px;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 8px #0008}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:22px;font-weight:700;text-shadow:0 2px 10px #0008;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<div id="msg">Tap, Space or ↑ to start<br><small>↑/Space jump · ↓ duck</small></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg');
let W,H;function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}addEventListener('resize',resize);resize();
let best=+localStorage.getItem('dinoBest')||0,state='menu',score=0,speed,dino,obs,clouds,t,ducking;
const G=()=>H*0.78;
function reset(){state='play';score=0;speed=6*devicePixelRatio;dino={y:0,vy:0,ducking:false};obs=[];clouds=[];t=0;msg.style.display='none';}
function jump(){if(state!=='play'){reset();return;} if(dino.y===0){dino.vy=-H*0.0232;}}
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();jump();}
  if(e.key==='ArrowDown')dino.ducking=true;});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')dino.ducking=false;});
addEventListener('touchstart',e=>{const y=e.touches[0].clientY;if(y>innerHeight*0.6&&state==='play')dino.ducking=true;else jump();},{passive:true});
addEventListener('touchend',()=>{if(dino)dino.ducking=false;});
addEventListener('mousedown',jump);
function over(){state='over';if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('dinoBest',best);}
  msg.style.display='flex';msg.innerHTML='Game over · '+Math.floor(score)+'<br>Tap, Space or ↑ to retry';}
function skyColor(){const p=(Math.sin(score*0.002)+1)/2;const a=[127,214,255],b=[25,30,70];return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*p)).join(',')+')';}
function drawLayer(off,color,base,amp,speedMul){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8){const wx=x+((-t*speed*speedMul+off)%W+W)%W;ctx.lineTo(x,G()-base-Math.sin(wx*0.004)*amp-Math.sin(wx*0.011)*amp*0.4);}
  ctx.lineTo(W,H);ctx.fill();}
function cactus(x,h,w,c){ctx.fillStyle=c;ctx.fillRect(x,G()-h,w,h);ctx.fillRect(x-w*0.9,G()-h*0.6,w*0.8,w*0.5);ctx.fillRect(x+w,G()-h*0.45,w*0.8,w*0.5);}
function drawDino(){const x=W*0.12,base=G()-dino.y;const h=dino.ducking?H*0.06:H*0.11,w=H*0.1;
  ctx.fillStyle='#2ecc71';ctx.fillRect(x,base-h,w,h*0.8);ctx.fillStyle='#27ae60';ctx.fillRect(x+w*0.55,base-h*1.3,w*0.6,h*0.65);
  ctx.fillStyle='#fff';ctx.fillRect(x+w*0.82,base-h*1.1,w*0.12,w*0.12);ctx.fillStyle='#111';ctx.fillRect(x+w*0.86,base-h*1.08,w*0.05,w*0.05);
  ctx.fillStyle='#ff7f50';ctx.fillRect(x+w*0.1,base-h*0.5,w*0.3,h*0.25);ctx.fillStyle='#e67e22';ctx.fillRect(x+w*0.2,base-h*0.05,w*0.2,h*0.05);}
function update(){if(state!=='play')return;t+=1;speed=Math.min(18*devicePixelRatio,6*devicePixelRatio+score*0.002*devicePixelRatio);
  score+=0.1;hud.textContent='Score '+Math.floor(score)+' · Best '+Math.max(best,Math.floor(score));
  dino.vy+=H*0.0009;dino.y=Math.max(0,dino.y-dino.vy);if(dino.y===0)dino.vy=0;
  if(Math.random()<0.012)clouds.push({x:W,y:Math.random()*H*0.3+H*0.05,r:H*0.03+Math.random()*H*0.02});
  if(obs.length===0||obs[obs.length-1].x<W*0.6){if(Math.random()<0.02){const flying=Math.random()<0.25&&score>200;
    obs.push({x:W+20,type:flying?'bird':'cactus',h:H*(0.07+Math.random()*0.08),w:H*0.04,y:flying?H*0.45:0});}}
  for(const o of obs)o.x-=speed;obs=obs.filter(o=>o.x>-100);
  for(const c of clouds)c.x-=speed*0.3;clouds=clouds.filter(c=>c.x>-100);
  const x=W*0.12,w=H*0.1,h=dino.ducking?H*0.06:H*0.11,by=G()-dino.y;
  for(const o of obs){const ox=o.x,oy=o.type==='bird'?G()-o.y:G();const oh=o.type==='bird'?H*0.05:o.h;
    if(x+w*0.7>ox&&x<ox+o.w&&by-h<oy&&by>oy-oh){over();return;}}
}
function draw(){ctx.fillStyle=skyColor();ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.85)';for(const c of clouds){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.arc(c.x+c.r,c.y-c.r*0.3,c.r*0.8,0,7);ctx.fill();}
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(W*0.85,H*0.15,H*0.05,0,7);ctx.fill();
  drawLayer(0,'#a3e4a1',H*0.04,H*0.03,0.2);drawLayer(300,'#6fcf7a',H*0.1,H*0.05,0.4);drawLayer(700,'#3aa857',H*0.16,H*0.06,0.6);
  ctx.fillStyle='#f4d58d';ctx.fillRect(0,G(),W,H-G());ctx.fillStyle='#e1b96a';for(let i=0;i<14;i++){const x=((i*W/14-t*speed*0.9)%W+W)%W;ctx.fillRect(x,G()+H*0.05,H*0.02,H*0.01);}
  for(const o of obs){if(o.type==='bird'){ctx.fillStyle='#ff5e7e';ctx.beginPath();ctx.ellipse(o.x,G()-o.y,o.w*0.9,o.w*0.45,0,0,7);ctx.fill();}
    else cactus(o.x,o.h,o.w,'#1e9e5a');}
  drawDino();}
function loop(){update();draw();requestAnimationFrame(loop);}
hud.textContent='Best '+best;reset();state='menu';draw();loop();
</script></body></html>
