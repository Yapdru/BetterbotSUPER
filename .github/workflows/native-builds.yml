name: Native preview builds
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/*.test.mjs
      - name: Verify idempotent full-text index
        run: |
          sqlite3 /tmp/knowledge.sqlite < knowledge/generated/import.sql
          sqlite3 /tmp/knowledge.sqlite < knowledge/generated/import.sql
          test "$(sqlite3 /tmp/knowledge.sqlite 'SELECT COUNT(*) FROM questions;')" = "1000"
          hits=$(sqlite3 /tmp/knowledge.sqlite <<'SQL'
          SELECT COUNT(*) FROM knowledge_fts WHERE knowledge_fts MATCH 'python AND dictionary';
          SQL
          )
          test "$hits" -gt 0
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish platforms/windows/BetterBot.csproj -c Release -r win-x64 --self-contained false -o output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: BetterBot-Windows-preview
          path: output/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash platforms/android/gradlew -p platforms/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BetterBot-Android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
