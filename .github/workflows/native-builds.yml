name: Native preview builds
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish platforms/windows/BetterBot.csproj -c Release -r win-x64 --self-contained false -o output/windows
      - uses: actions/upload-artifact@v4
        with:
          name: BetterBot-Windows-preview
          path: output/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash platforms/android/gradlew -p platforms/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BetterBot-Android-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
